<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>広陵祭　パソコンサイエンス部</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="bg-gradient-to-b from-[#E4C98A] via-[#E4C98A] via-[45%] via-[#4DA8DA] via-[70%] to-[#0077B6] text-[#123047] min-h-screen pb-16 font-sans font-medium overflow-x-hidden">

    <!-- ヘッダー -->
    <header class="text-center py-8 px-4 border-b border-[#123047]/40">

        <h1 class="text-2xl font-bold tracking-widest text-[#123047] uppercase mb-1">
            広陵祭巡り　~暁~
        </h1>

        <p class="text-xs font-semibold tracking-wider text-[#123047]">
            デジタルスタンプラリー
        </p>

    </header>


    <!-- メイン -->
    <main class="w-full mx-auto mt-4 text-center flex flex-col items-center justify-start px-4">

        <!-- スタンプ円 -->
        <div
            id="circle-container"
            class="relative w-[450px] h-[450px] mt-6 mb-6 border-2 border-[#123047]/70 rounded-full flex items-center justify-center mx-auto flex-shrink-0">

            <!-- 中央 -->
            <div
                id="center-display"
                class="w-[225px] h-[225px] rounded-full bg-[#FFF8E7]/85 border-2 border-[#005B82]/60 flex flex-col items-center justify-center text-center p-2 z-10 shadow-2xl transition-all duration-700">

                <div
                    id="center-icon"
                    class="text-[#005B82] text-2xl font-bold mb-1">
                    LOCKED
                </div>

                <div
                    id="center-text"
                    class="text-xs tracking-widest text-[#005B82] uppercase font-bold">
                    0 / 13
                </div>

                <!-- FINAL SPOT -->
                <button
                    id="spot14"
                    onclick="checkPasswordModal('spot14')"
                    class="hidden opacity-0 scale-75 absolute w-24 h-10 rounded-lg bg-[#005B82] border border-[#E7C98B] text-white text-[10px] font-bold tracking-widest uppercase items-center justify-center transition-all duration-500 z-30 mt-1 hover:bg-[#004565]">
                    FINAL SPOT
                </button>

            </div>
        </div>


        <!-- コンプリートメッセージ -->
        <section
            id="clear-message"
            class="hidden mt-4 w-full max-w-sm bg-[#123047]/90 border border-[#E7C98B] rounded-xl p-5 text-center transition-all mx-auto shadow-lg">

            <p class="text-xs font-bold text-white leading-relaxed tracking-wide">
                スタンプコンプリート!!<br>
                パソコンサイエンス部展示室にて景品を贈呈します
            </p>

        </section>


        <!-- デバッグ -->
        <div class="text-center mt-6 opacity-5 hover:opacity-40 transition-opacity w-full flex justify-center gap-2">

            <button
                onclick="debugAllClear()"
                class="text-[9px] font-semibold tracking-widest text-[#123047] uppercase px-3 py-1 border border-[#123047] rounded hover:bg-[#123047]/10 transition-colors">
                [ Debug: All Clear ]
            </button>

            <button
                onclick="resetRally()"
                class="text-[9px] font-semibold tracking-widest text-[#123047] uppercase px-3 py-1 border border-[#123047] rounded hover:bg-[#123047]/10 transition-colors">
                [ Debug: Reset ]
            </button>

        </div>

    </main>


    <!-- パスワードモーダル -->
    <div
        id="password-modal"
        class="hidden fixed inset-0 bg-[#06283D]/45 flex items-center justify-center z-50 opacity-0 transition-opacity duration-300 backdrop-blur-sm p-6">

        <div
            class="bg-gradient-to-b from-[#0077B6] via-[#4DA8DA] to-[#D9BC83] border border-[#123047]/50 rounded-2xl w-full max-w-sm p-8 shadow-2xl scale-95 transition-transform duration-300">

            <div class="text-center mb-6">

                <div class="text-[#123047] text-3xl mb-3">
                    🔑
                </div>

                <h3 class="text-lg font-bold text-[#123047] tracking-wider mb-1">
                    パスワードが必要です
                </h3>

                <p
                    id="modal-spot-name"
                    class="text-xs font-semibold text-[#123047] tracking-wide">
                    スポットのパスワードを入力してください
                </p>

            </div>


            <!-- パスワード入力 -->
            <div class="mb-5">

                <input
                    type="password"
                    id="password-input"
                    placeholder="******"
                    class="w-full bg-[#FFFDF7] border border-[#123047]/40 rounded-xl py-3 px-5 text-[#123047] font-semibold text-center text-lg tracking-widest focus:outline-none focus:border-[#005B82] focus:ring-1 focus:ring-[#005B82] transition-all placeholder:text-[#78909C] placeholder:tracking-normal">

                <p
                    id="password-error"
                    class="hidden text-[#123047] font-semibold text-[11px] text-center mt-2 tracking-wide">
                    パスワードが正しくありません
                </p>

            </div>


            <!-- ボタン -->
            <div class="flex gap-3">

                <button
                    onclick="closePasswordModal()"
                    class="flex-1 bg-[#FFFDF5] hover:bg-[#E8D6AA] text-[#123047] font-bold py-3 rounded-xl text-xs tracking-wider transition-all">
                    CANCEL
                </button>

                <button
                    onclick="submitPassword()"
                    class="flex-1 bg-[#FFFDF5] hover:bg-[#E8D6AA] text-[#123047] font-bold py-3 rounded-xl text-xs tracking-wider transition-all shadow-md">
                    UNLOCK
                </button>

            </div>

        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
