<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オービット・デジタルスタンプラリー [AUTH]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-white text-zinc-100 min-h-screen pb-16 font-sans overflow-x-hidden">

    <header class="text-center py-12 px-4 border-b border-zinc-900">
     <h1 class="text-2xl font-light tracking-widest text-black uppercase mb-1">広陵祭ラリー　~暁~</h1>
     <p class="text-xs tracking-wider text-black">デジタルスタンプラリー</p>
    </header>

    <main class="w-full mx-auto mt-6 text-center flex flex-col items-center justify-start overflow-hidden px-4">
        
        <div id="circle-container" class="relative w-[450px] h-[450px] mt-[40px] mb-8 border border-zinc-900 rounded-full flex items-center justify-center mx-auto flex-shrink-0">
            
            <div id="center-display" class="w-[225px] h-[225px] rounded-full bg-zinc-950 border border-zinc-800 flex flex-col items-center justify-center text-center p-2 z-10 shadow-2xl transition-all duration-700">
                <div id="center-icon" class="text-zinc-600 text-2xl font-light mb-1">🔒</div>
                <div id="center-text" class="text-xs tracking-widest text-zinc-500 uppercase font-light">0 / 13</div>
                
                <button id="spot14" onclick="checkPasswordModal('spot14')" class="hidden opacity-0 scale-75 absolute w-24 h-10 rounded-lg bg-zinc-900 border border-zinc-800 text-cyan-500 text-[10px] tracking-widest uppercase flex items-center justify-center transition-all duration-500 z-30 mt-1 hover:border-cyan-400">
                  FINAL SPOT
                </button>
            </div>

        </div> <section id="clear-message" class="hidden mt-6 w-full max-w-sm bg-zinc-900 border border-cyan-500/20 rounded-xl p-5 text-center transition-all mx-auto">
            <p class="text-xs text-zinc-400 leading-relaxed tracking-wide">
                スタンプコンプリート!!<br>
                パソコンサイエンス部展示室にて景品を贈呈します
            </p>
        </section>

        <div class="text-center mt-8 opacity-5 hover:opacity-40 transition-opacity w-full flex justify-center gap-2">
            <button onclick="debugAllClear()" class="text-[9px] tracking-widest text-cyan-700 uppercase px-3 py-1 border border-zinc-900 rounded hover:border-cyan-800 transition-colors">
                [ Debug: All Clear ]
            </button>
            <button onclick="resetRally()" class="text-[9px] tracking-widest text-zinc-700 uppercase px-3 py-1 border border-zinc-900 rounded hover:border-zinc-500 transition-colors">
                [ Debug: Reset ]
            </button>
        </div>
        
    </main>

    <div id="password-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 transition-opacity duration-300 backdrop-blur-sm p-6">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-sm p-8 shadow-2xl scale-95 transition-transform duration-300">
            <div class="text-center mb-6">
                <div class="text-cyan-400 text-3xl mb-3">🔑</div>
                <h3 class="text-lg font-medium text-white tracking-wider mb-1">認証が必要です</h3>
                <p id="modal-spot-name" class="text-xs text-zinc-500 tracking-wide">スポットのパスワードを入力してください</p>
            </div>
            
            <div class="mb-5">
                <input type="password" id="password-input" placeholder="••••••" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl py-3 px-5 text-white text-center text-lg tracking-widest focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder:text-zinc-600 placeholder:tracking-normal">
                <p id="password-error" class="hidden text-red-500 text-[11px] text-center mt-2 tracking-wide">パスワードが正しくありません</p>
            </div>
            
            <div class="flex gap-3">
                <button onclick="closePasswordModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-xl text-xs tracking-wider transition-all">
                    CANCEL
                </button>
                <button onclick="submitPassword()" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-bold py-3 rounded-xl text-xs tracking-wider transition-all shadow-md">
                    UNLOCK
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
