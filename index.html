<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>広陵祭　パソコンサイエンス部</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ABC1234567"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-JXFHZRDGCF');
    </script>
</head>

<body class="bg-gradient-to-b from-[#E4C98A] via-[#E4C98A] via-[10%] via-[#4DA8DA] via-[30%] to-[#0077B6] text-[#123047] min-h-screen pb-12 font-sans font-medium overflow-x-hidden">

    <header class="text-center py-6 sm:py-8 px-4 border-b border-[#123047]/40">
        <h1 class="text-xl sm:text-2xl font-bold tracking-widest mb-1">
            広陵祭巡り　~暁~
        </h1>

        <p class="text-[10px] sm:text-xs font-semibold tracking-wider">
            デジタルスタンプラリー
        </p>
    </header>

    <main class="w-full mx-auto mt-3 sm:mt-4 text-center flex flex-col items-center px-3 sm:px-4">

        <div
            id="circle-container"
            class="relative w-[68vw] h-[68vw] max-w-[380px] max-h-[380px] mt-4 sm:mt-6 mb-5 sm:mb-6 border-2 border-[#123047]/70 rounded-full flex items-center justify-center mx-auto flex-shrink-0"
        >

            <div
                id="center-display"
                class="w-[46%] h-[46%] rounded-full bg-[#FFF8E7]/85 border-2 border-[#005B82]/60 flex flex-col items-center justify-center text-center p-2 z-10 shadow-2xl transition-all duration-700"
            >

                <div
                    id="center-icon"
                    class="text-[#005B82] text-base sm:text-2xl font-bold mb-1"
                >
                    LOCKED
                </div>

                <div
                    id="center-text"
                    class="text-[9px] sm:text-xs tracking-widest text-[#005B82] uppercase font-bold"
                >
                    0 / 13
                </div>

                <button
                    id="spot14"
                    onclick="checkPasswordModal('spot14')"
                    class="hidden opacity-0 scale-75 absolute w-20 sm:w-24 h-9 sm:h-10 rounded-lg bg-[#005B82] border border-[#E7C98B] text-white text-[9px] sm:text-[10px] font-bold tracking-widest items-center justify-center transition-all duration-500 z-30 hover:bg-[#004565]"
                >
                    FINAL SPOT
                </button>

            </div>
        </div>

        <section
            id="clear-message"
            class="hidden mt-3 sm:mt-4 w-full max-w-sm bg-[#123047]/90 border border-[#E7C98B] rounded-xl p-4 sm:p-5 shadow-lg"
        >
            <p class="text-[11px] sm:text-xs font-bold text-white leading-relaxed tracking-wide">
                スタンプコンプリート!!<br>
                パソコンサイエンス部展示室にて景品を贈呈します
            </p>
        </section>

    </main>


    <!-- パスワードモーダル -->

    <div
        id="password-modal"
        class="hidden fixed inset-0 bg-[#06283D]/45 flex items-center justify-center z-50 opacity-0 transition-opacity duration-300 backdrop-blur-sm p-5"
    >

        <div
            class="bg-gradient-to-b from-[#0077B6] via-[#4DA8DA] to-[#D9BC83] border border-[#123047]/50 rounded-2xl w-full max-w-sm p-6 sm:p-8 shadow-2xl scale-95 transition-transform duration-300"
        >

            <div class="text-center mb-5 sm:mb-6">

                <div class="text-[#123047] text-2xl sm:text-3xl mb-2">
                    🔑
                </div>

                <h3 class="text-base sm:text-lg font-bold tracking-wider mb-1">
                    パスワードが必要です
                </h3>

                <p
                    id="modal-spot-name"
                    class="text-[10px] sm:text-xs font-semibold tracking-wide"
                >
                    スポットのパスワードを入力してください
                </p>

            </div>


            <div class="mb-4 sm:mb-5">

                <input
                    id="password-input"
                    type="password"
                    placeholder="******"
                    class="w-full bg-[#FFFDF7] border border-[#123047]/40 rounded-xl py-3 px-4 text-[#123047] font-semibold text-center text-base tracking-widest focus:outline-none focus:border-[#005B82] focus:ring-1 focus:ring-[#005B82]"
                >

                <p
                    id="password-error"
                    class="hidden text-[#123047] font-semibold text-[10px] text-center mt-2"
                >
                    パスワードが正しくありません
                </p>

            </div>


            <div class="flex gap-2 sm:gap-3">

                <button
                    onclick="closePasswordModal()"
                    class="flex-1 bg-[#FFFDF5] hover:bg-[#E8D6AA] font-bold py-3 rounded-xl text-[10px] sm:text-xs"
                >
                    CANCEL
                </button>

                <button
                    onclick="submitPassword()"
                    class="flex-1 bg-[#FFFDF5] hover:bg-[#E8D6AA] font-bold py-3 rounded-xl text-[10px] sm:text-xs shadow-md"
                >
                    UNLOCK
                </button>

            </div>

        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
